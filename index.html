<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Expense Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 20px;
    }

    .app {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 {
      text-align: center;
      color: #2563eb;
      font-size: 26px;
    }

    p {
      text-align: center;
      color: #555;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
    }

    .total {
      background: #dcfce7;
      color: #166534;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    li {
      background: #f1f5f9;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .delete {
      background: #dc2626;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>💰 Daily Expense Tracker</h1>
    <p>Track your daily spending easily!</p>

    <input id="item" type="text" placeholder="What did you spend on?">

    <input id="amount" type="number" min="0.01" step="0.01"
      placeholder="Amount (BDT)">

    <button onclick="addExpense()">Add Expense</button>

    <div class="total">
      Total: ৳<span id="total">0.00</span>
    </div>

    <h3>Your Expenses</h3>
    <ul id="list"></ul>
  </div>

  <script>
    let expenses = [];

    try {
      expenses = JSON.parse(
        localStorage.getItem("expenses") || "[]"
      );
    } catch (error) {
      expenses = [];
    }

    function saveExpenses() {
      localStorage.setItem("expenses", JSON.stringify(expenses));
    }

    function renderExpenses() {
      const list = document.getElementById("list");
      list.innerHTML = "";

      let total = 0;

      expenses.forEach(function(expense, index) {
        total += expense.amount;

        const li = document.createElement("li");
        li.appendChild(
          document.createTextNode(
            expense.item + " — ৳" + expense.amount.toFixed(2)
          )
        );

        const button = document.createElement("button");
        button.textContent = "Delete";
        button.className = "delete";

        button.onclick = function() {
          expenses.splice(index, 1);
          saveExpenses();
          renderExpenses();
        };

        li.appendChild(document.createElement("br"));
        li.appendChild(button);
        list.appendChild(li);
      });

      document.getElementById("total").textContent =
        total.toFixed(2);
    }

    function addExpense() {
      const itemInput = document.getElementById("item");
      const amountInput = document.getElementById("amount");

      const item = itemInput.value.trim();
      const amount = Number(amountInput.value);

      if (!item || !Number.isFinite(amount) || amount <= 0) {
        alert("Please enter an expense name and a valid amount.");
        return;
      }

      expenses.push({ item: item, amount: amount });
      saveExpenses();

      itemInput.value = "";
      amountInput.value = "";

      renderExpenses();
    }

    renderExpenses();
  </script>
</body>
</html>
